name: Build LocalSend Chat (Windows + Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Compile for Windows
        working-directory: app
        run: flutter build windows
      - name: Package
        working-directory: app
        run: |
          echo {} > build/windows/x64/runner/Release/settings.json
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/
          Remove-Item build/windows/x64/runner/Release/localsend_msix_helper.msix -ErrorAction SilentlyContinue
          Remove-Item build/windows/x64/runner/Release/install_msix_helper.ps1 -ErrorAction SilentlyContinue
          Remove-Item build/windows/x64/runner/Release/localsend_app.exe.manifest -ErrorAction SilentlyContinue
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LocalSendChat-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/LocalSendChat-Windows.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Separate app id and signing key
        run: |
          sed -i 's/applicationId "org.localsend.localsend_app"/applicationId "org.localsend.localsend_app.chat"/' app/android/app/build.gradle
          sed -i 's/android:label="LocalSend"/android:label="LocalSend Chat"/g' app/android/app/src/main/AndroidManifest.xml
          keytool -genkeypair -v -keystore $GITHUB_WORKSPACE/chat.jks -alias chat -keyalg RSA -keysize 2048 -validity 10000 -storepass chatpass -keypass chatpass -dname "CN=LocalSend Chat"
          printf "storePassword=chatpass\nkeyPassword=chatpass\nkeyAlias=chat\nstoreFile=$GITHUB_WORKSPACE/chat.jks\n" > app/android/key.properties
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk
      - run: cp app/build/app/outputs/flutter-apk/app-release.apk LocalSendChat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LocalSendChat.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chat-v${{ github.run_number }}
          name: LocalSend Chat v${{ github.run_number }}
          files: |
            windows/LocalSendChat-Windows.zip
            android/LocalSendChat.apk
